<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Interview Availability</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .date-card { transition: all 0.2s; }
    .date-card:hover { transform: translateY(-2px); }
    .date-card.selected { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
    .time-slot { transition: all 0.15s; }
    .time-slot:hover { transform: scale(1.02); }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">
  <div id="app" class="container mx-auto px-4 py-8 max-w-5xl"></div>

  <script>
    const SUPABASE_URL = 'https://fbgqqkvufdofbgmtvhmn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiZ3Fxa3Z1ZmRvZmJnbXR2aG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDQyNTEsImV4cCI6MjA5Mjg4MDI1MX0.-r4YK-hDnc1tAIYj6HHyYsIuaFl4wjUwHcmO1f0QbcM';

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    let selectedDate = null;
    let selectedTimeSlots = {}; // { date: [slot1, slot2, ...] }
    let availabilityData = null;

    if (!token) {
      showError('Invalid or missing confirmation link');
    } else {
      loadData();
    }

    async function supabaseQuery(query) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${query}`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    }

    async function supabaseUpdate(table, data, filter) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(data)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    }

    async function loadData() {
      showLoading();
      try {
        const data = await supabaseQuery(`availability_requests?token=eq.${token}&select=*`);
        if (!data || data.length === 0) {
          showError('Availability request not found or has expired');
          return;
        }
        
        availabilityData = data[0];
        
        // Check if already submitted
        if (availabilityData.status === 'confirmed') {
          showAlreadySubmitted();
          return;
        }
        
        renderMainPage();
      } catch (err) {
        console.error('Error:', err);
        showError('Failed to load availability request');
      }
    }

    function showLoading() {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen">
          <div class="text-center">
            <div class="animate-spin w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full mx-auto mb-4"></div>
            <p class="text-gray-600 text-lg font-medium">Loading your availability request...</p>
          </div>
        </div>
      `;
    }

    function showError(message) {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen px-4">
          <div class="bg-white rounded-2xl shadow-2xl p-12 text-center max-w-md w-full">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
              <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-3">Request Not Found</h2>
            <p class="text-gray-600">${message}</p>
          </div>
        </div>
      `;
    }

    function showAlreadySubmitted() {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen px-4">
          <div class="bg-white rounded-2xl shadow-2xl p-12 text-center max-w-md w-full">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
              <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-3">Already Confirmed</h2>
            <p class="text-gray-600 mb-2">Your availability has already been submitted.</p>
            <p class="text-gray-500 text-sm">If you need to make changes, please contact the recruiter.</p>
          </div>
        </div>
      `;
    }

    function generateHourlySlots(startTime, endTime) {
      const start = parseInt(startTime.split(':')[0]);
      const end = parseInt(endTime.split(':')[0]);
      const slots = [];
      
      for (let h = start; h < end; h++) {
        const startFormatted = `${h.toString().padStart(2,'0')}:00`;
        const endFormatted = `${(h+1).toString().padStart(2,'0')}:00`;
        const displayTime = formatTimeRange(h, h+1);
        
        slots.push({
          start: startFormatted,
          end: endFormatted,
          display: displayTime
        });
      }
      
      return slots;
    }

    function formatTimeRange(startHour, endHour) {
      const formatHour = (h) => {
        if (h === 0) return '12:00 AM';
        if (h < 12) return `${h}:00 AM`;
        if (h === 12) return '12:00 PM';
        return `${h-12}:00 PM`;
      };
      return `${formatHour(startHour)} - ${formatHour(endHour)}`;
    }

    function renderMainPage() {
      // Group slots by date
      const dateGroups = {};
      availabilityData.slots.forEach(slot => {
        if (!dateGroups[slot.date]) {
          dateGroups[slot.date] = {
            date: slot.date,
            startTime: slot.start,
            endTime: slot.end
          };
        }
      });

      const dates = Object.values(dateGroups);

      document.getElementById('app').innerHTML = `
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
          <!-- Header -->
          <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white px-8 py-8">
            <h1 class="text-3xl md:text-4xl font-bold mb-3">Confirm Your Interview Availability</h1>
            <p class="text-blue-100 text-lg">Hi <span class="font-semibold">${availabilityData.candidate_name}</span>, please select when you're available for <span class="font-semibold">${availabilityData.job_title}</span></p>
          </div>

          <!-- Instructions -->
          <div class="px-8 py-6 bg-blue-50 border-b border-blue-200">
            <div class="flex items-start gap-3">
              <svg class="w-6 h-6 text-blue-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <div class="text-blue-900">
                <p class="font-semibold mb-1">How to confirm your availability:</p>
                <ol class="text-sm space-y-1 list-decimal list-inside">
                  <li>Select one or multiple dates and time slots according to your availability</li>
                  <li>Click "Confirm My Availability" to submit</li>
                </ol>
              </div>
            </div>
          </div>

          <!-- Date Selection -->
          <div class="px-8 py-8">
            <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
              <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path>
              </svg>
              Step 1: Select Your Available Day(s)
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8" id="datesList">
              ${dates.map(dateInfo => renderDateCard(dateInfo)).join('')}
            </div>

            <!-- Time Slots Section -->
            <div id="timeSlotsSection" class="hidden">
              <div class="border-t border-gray-200 pt-8 mb-8">
                <h2 class="text-xl font-bold text-gray-900 mb-2 flex items-center gap-2">
                  <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path>
                  </svg>
                  Step 2: Select Your Available Time(s)
                </h2>
                <p class="text-gray-600 mb-1 font-medium" id="selectedDateDisplay"></p>
                <p class="text-sm text-gray-500 mb-6">Select all 1-hour slots when you're available. You can choose multiple slots as backup options.</p>
                
                <div id="timeSlotsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  <!-- Time slots populated here -->
                </div>
              </div>
            </div>

            <!-- Selected Summary -->
            <div id="selectedSummary" class="hidden bg-gradient-to-r from-green-50 to-emerald-50 border-2 border-green-200 rounded-xl p-6 mb-6">
              <h3 class="text-lg font-bold text-green-900 mb-3 flex items-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                </svg>
                Your Selected Availability
              </h3>
              <div id="summaryList" class="space-y-2"></div>
            </div>

            <!-- Confirm Button -->
            <button 
              id="confirmBtn"
              onclick="confirmAvailability()"
              disabled
              class="w-full py-5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold text-lg hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg disabled:from-gray-300 disabled:to-gray-400 disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-3"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              Confirm My Availability
            </button>
          </div>
        </div>
      `;

      updateUI();
    }

    function renderDateCard(dateInfo) {
      const date = new Date(dateInfo.date + 'T00:00:00');
      const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
      const day = date.getDate();
      const month = date.toLocaleDateString('en-US', { month: 'long' });
      const year = date.getFullYear();
      const isSelected = selectedDate === dateInfo.date;

      return `
        <button 
          onclick="selectDate('${dateInfo.date}')"
          class="date-card text-left p-6 rounded-xl border-2 transition-all ${
            isSelected 
              ? 'border-blue-600 bg-blue-50 selected shadow-lg' 
              : 'border-gray-200 bg-white hover:border-blue-300 hover:shadow-md'
          }"
        >
          <div class="flex items-center justify-between mb-2">
            <div class="text-lg font-bold ${isSelected ? 'text-blue-600' : 'text-gray-900'}">${day} ${month} ${year}, ${dayName}</div>
            ${isSelected ? `
              <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0 ml-3">
                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                </svg>
              </div>
            ` : ''}
          </div>
          ${(selectedTimeSlots[dateInfo.date] || []).length > 0 ? `
            <div class="mt-3 pt-3 border-t ${isSelected ? 'border-blue-200' : 'border-gray-200'}">
              <div class="text-xs font-semibold ${isSelected ? 'text-blue-600' : 'text-green-600'}">
                ✓ ${selectedTimeSlots[dateInfo.date].length} slot(s) selected
              </div>
            </div>
          ` : ''}
        </button>
      `;
    }

    function selectDate(date) {
      selectedDate = date;
      renderMainPage();
      
      // Show time slots
      const slot = availabilityData.slots.find(s => s.date === date);
      if (slot) {
        const hourlySlots = generateHourlySlots(slot.start, slot.end);
        renderTimeSlots(date, hourlySlots);
      }
      
      // Scroll to time slots
      setTimeout(() => {
        document.getElementById('timeSlotsSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    function renderTimeSlots(date, slots) {
      const section = document.getElementById('timeSlotsSection');
      const displayElem = document.getElementById('selectedDateDisplay');
      const listElem = document.getElementById('timeSlotsList');
      
      const dateObj = new Date(date + 'T00:00:00');
      const dateString = dateObj.toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'long', 
        day: 'numeric', 
        year: 'numeric' 
      });
      
      displayElem.textContent = dateString;
      section.classList.remove('hidden');
      
      const selected = selectedTimeSlots[date] || [];
      
      listElem.innerHTML = slots.map(slot => {
        const isSelected = selected.some(s => s.start === slot.start);
        return `
          <button 
            onclick="toggleTimeSlot('${date}', '${slot.start}', '${slot.end}', '${slot.display}')"
            class="time-slot p-4 rounded-lg border-2 text-center font-semibold transition-all ${
              isSelected 
                ? 'bg-gradient-to-br from-blue-600 to-indigo-600 border-blue-600 text-white shadow-lg' 
                : 'bg-white border-gray-300 text-gray-700 hover:border-blue-400 hover:bg-blue-50'
            }"
          >
            <div class="text-sm ${isSelected ? 'text-blue-100' : 'text-gray-500'} mb-1">📅</div>
            <div class="${isSelected ? 'text-white' : 'text-gray-900'}">${slot.display}</div>
            ${isSelected ? '<div class="text-xs text-blue-100 mt-2">✓ Selected</div>' : ''}
          </button>
        `;
      }).join('');
    }

    function toggleTimeSlot(date, start, end, display) {
      if (!selectedTimeSlots[date]) {
        selectedTimeSlots[date] = [];
      }
      
      const index = selectedTimeSlots[date].findIndex(s => s.start === start);
      
      if (index >= 0) {
        selectedTimeSlots[date].splice(index, 1);
      } else {
        selectedTimeSlots[date].push({ date, start, end, display });
      }
      
      renderMainPage();
      
      // Re-render time slots for current date
      const slot = availabilityData.slots.find(s => s.date === date);
      if (slot) {
        const hourlySlots = generateHourlySlots(slot.start, slot.end);
        renderTimeSlots(date, hourlySlots);
      }
    }

    function updateUI() {
      const confirmBtn = document.getElementById('confirmBtn');
      const summary = document.getElementById('selectedSummary');
      const summaryList = document.getElementById('summaryList');
      
      // Count total selected slots
      const totalSelected = Object.values(selectedTimeSlots).reduce((sum, slots) => sum + slots.length, 0);
      
      confirmBtn.disabled = totalSelected === 0;
      
      if (totalSelected > 0) {
        summary.classList.remove('hidden');
        
        let summaryHTML = '';
        Object.entries(selectedTimeSlots).forEach(([date, slots]) => {
          if (slots.length > 0) {
            const dateObj = new Date(date + 'T00:00:00');
            const dateStr = dateObj.toLocaleDateString('en-US', { 
              weekday: 'short', 
              month: 'short', 
              day: 'numeric' 
            });
            
            summaryHTML += `
              <div class="bg-white rounded-lg p-4 border border-green-200">
                <div class="font-semibold text-green-900 mb-2">${dateStr}</div>
                <div class="space-y-1">
                  ${slots.map(s => `
                    <div class="text-sm text-green-800 flex items-center gap-2">
                      <svg class="w-4 h-4 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                      </svg>
                      ${s.display}
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }
        });
        
        summaryList.innerHTML = summaryHTML;
      } else {
        summary.classList.add('hidden');
      }
    }

    async function confirmAvailability() {
      // Flatten all selected slots
      const allSlots = [];
      Object.values(selectedTimeSlots).forEach(slots => {
        allSlots.push(...slots);
      });
      
      if (allSlots.length === 0) {
        alert('Please select at least one time slot');
        return;
      }
      
      // Disable button and show loading
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin w-6 h-6" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Confirming...
      `;

      try {
        await supabaseUpdate(
          'availability_requests',
          {
            selected_slot: allSlots,
            status: 'confirmed',
            confirmed_at: new Date().toISOString()
          },
          `token=eq.${token}`
        );

        showSuccess();
      } catch (err) {
        console.error('Error:', err);
        alert('Failed to confirm availability. Please try again.');
        btn.disabled = false;
        btn.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Confirm My Availability
        `;
      }
    }

    function showSuccess() {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen px-4">
          <div class="bg-white rounded-2xl shadow-2xl p-12 text-center max-w-lg w-full">
            <div class="w-24 h-24 bg-gradient-to-br from-green-400 to-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 animate-bounce">
              <svg class="w-14 h-14 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="text-3xl font-bold text-gray-900 mb-4">Thank You!</h2>
            <p class="text-lg text-gray-600 mb-2">Your availability has been confirmed successfully.</p>
            <p class="text-gray-500">The recruiter will contact you shortly to schedule your interview.</p>
            <div class="mt-8 pt-8 border-t border-gray-200">
              <p class="text-sm text-gray-400">You can now close this page.</p>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
