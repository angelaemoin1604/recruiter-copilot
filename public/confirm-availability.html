<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Interview Availability</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .date-btn { transition: all 0.2s; cursor: pointer; }
    .date-btn:hover { transform: scale(1.05); }
    .time-slot { transition: all 0.15s; cursor: pointer; }
    .time-slot:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 min-h-screen">
  <div id="app"></div>

  <script>
    const SUPABASE_URL = 'https://fbgqqkvufdofbgmtvhmn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiZ3Fxa3Z1ZmRvZmJnbXR2aG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDQyNTEsImV4cCI6MjA5Mjg4MDI1MX0.-r4YK-hDnc1tAIYj6HHyYsIuaFl4wjUwHcmO1f0QbcM';

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    let selectedDate = null;
    let selectedTimeSlots = {};
    let availabilityData = null;
    let currentViewMonth = null; // Will be set when data loads
    let availableMonths = []; // All months that have available dates

    if (!token) {
      showError('Invalid or missing confirmation link');
    } else {
      loadData();
    }

    async function supabaseQuery(query) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${query}`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    }

    async function supabaseUpdate(table, data, filter) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(data)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    }

    async function loadData() {
      showLoading();
      try {
        const data = await supabaseQuery(`availability_requests?token=eq.${token}&select=*`);
        if (!data || data.length === 0) {
          showError('Availability request not found or has expired');
          return;
        }
        
        availabilityData = data[0];
        
        if (availabilityData.status === 'confirmed') {
          showAlreadySubmitted();
          return;
        }
        
        const createdAt = new Date(availabilityData.created_at);
        const now = new Date();
        const hoursSinceCreated = (now - createdAt) / (1000 * 60 * 60);
        
        if (hoursSinceCreated > 48) {
          await supabaseUpdate('availability_requests', { status: 'expired' }, `token=eq.${token}`);
          showExpired();
          return;
        }
        
        renderMainPage();
      } catch (err) {
        console.error('Error:', err);
        showError('Failed to load availability request');
      }
    }

    function showLoading() {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen">
          <div class="text-center">
            <div class="animate-spin w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full mx-auto mb-3"></div>
            <p class="text-gray-600 text-sm font-medium">Loading...</p>
          </div>
        </div>
      `;
    }

    function showError(message) {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen px-4">
          <div class="bg-white rounded-xl shadow-xl p-8 text-center max-w-md w-full">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-2">Request Not Found</h2>
            <p class="text-sm text-gray-600">${message}</p>
          </div>
        </div>
      `;
    }

    function showAlreadySubmitted() {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen px-4">
          <div class="bg-white rounded-xl shadow-xl p-8 text-center max-w-md w-full">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-2">Already Confirmed</h2>
            <p class="text-sm text-gray-600">Your availability has already been submitted.</p>
          </div>
        </div>
      `;
    }

    function showExpired() {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen px-4">
          <div class="bg-white rounded-xl shadow-xl p-8 text-center max-w-md w-full">
            <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-10 h-10 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-2">Request Expired</h2>
            <p class="text-sm text-gray-600 mb-3">This link has expired (48-hour window passed).</p>
            <p class="text-xs text-gray-500">Please contact the recruiter to reschedule.</p>
          </div>
        </div>
      `;
    }

    function generateHourlySlots(startTime, endTime) {
      const start = parseInt(startTime.split(':')[0]);
      const end = parseInt(endTime.split(':')[0]);
      const slots = [];
      
      for (let h = start; h < end; h++) {
        const startFormatted = `${h.toString().padStart(2,'0')}:00`;
        const endFormatted = `${(h+1).toString().padStart(2,'0')}:00`;
        const displayTime = formatTimeRange(h, h+1);
        
        slots.push({
          start: startFormatted,
          end: endFormatted,
          display: displayTime
        });
      }
      
      return slots;
    }

    function formatTimeRange(startHour, endHour) {
      const formatHour = (h) => {
        if (h === 0) return '12:00 AM';
        if (h < 12) return `${h}:00 AM`;
        if (h === 12) return '12:00 PM';
        return `${h-12}:00 PM`;
      };
      return `${formatHour(startHour)} - ${formatHour(endHour)}`;
    }

    function renderCalendar(availableDates) {
      // Use currentViewMonth for display
      const month = currentViewMonth.getMonth();
      const year = currentViewMonth.getFullYear();
      
      // Create lookup map for available dates (ALL months)
      const availableDateMap = {};
      availableDates.forEach(d => {
        availableDateMap[d.date] = true;
      });
      
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      
      // Get calendar grid for current view month
      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);
      const startDay = firstDayOfMonth.getDay();
      const daysInMonth = lastDayOfMonth.getDate();
      
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      // Check if there are dates in other months for showing arrows
      const hasDatesBefore = availableDates.some(d => {
        const dt = new Date(d.date + 'T00:00:00');
        return dt.getFullYear() < year || (dt.getFullYear() === year && dt.getMonth() < month);
      });
      const hasDatesAfter = availableDates.some(d => {
        const dt = new Date(d.date + 'T00:00:00');
        return dt.getFullYear() > year || (dt.getFullYear() === year && dt.getMonth() > month);
      });
      
      // Count available dates in this month
      const availableInThisMonth = availableDates.filter(d => {
        const dt = new Date(d.date + 'T00:00:00');
        return dt.getMonth() === month && dt.getFullYear() === year;
      }).length;

      let calendarHTML = `
        <!-- Month Navigation -->
        <div class="flex items-center justify-between mb-3">
          <button onclick="navigateMonth(-1)" class="p-1.5 rounded hover:bg-gray-100 transition ${hasDatesBefore ? '' : 'invisible'}">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
          </button>
          <div class="text-center">
            <div class="font-bold text-gray-900 text-sm">${monthNames[month]} ${year}</div>
            ${availableInThisMonth > 0 ? `<div class="text-xs text-blue-600">${availableInThisMonth} date${availableInThisMonth > 1 ? 's' : ''} available</div>` : `<div class="text-xs text-gray-400">No dates this month</div>`}
          </div>
          <button onclick="navigateMonth(1)" class="p-1.5 rounded hover:bg-gray-100 transition ${hasDatesAfter ? '' : 'invisible'}">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>
        
        <!-- Day headers -->
        <div class="grid grid-cols-7 mb-1">
          ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `
            <div class="text-xs font-semibold text-gray-500 text-center py-1">${day}</div>
          `).join('')}
        </div>
        
        <!-- Calendar days -->
        <div class="grid grid-cols-7 border-t border-gray-200">
      `;
      
      // Add empty cells for days before month starts
      for (let i = 0; i < startDay; i++) {
        calendarHTML += '<div class="py-2 text-center text-xs text-gray-300 border-b border-gray-100"></div>';
      }
      
      // Add days of month
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isAvailable = availableDateMap[dateStr];
        const isSelected = selectedDate === dateStr;
        const hasSelections = selectedTimeSlots[dateStr] && selectedTimeSlots[dateStr].length > 0;
        const currentDate = new Date(year, month, day);
        const isPast = currentDate < today;
        
        if (isAvailable) {
          calendarHTML += `
            <button 
              onclick="selectDate('${dateStr}')"
              class="py-2 text-center text-sm font-bold border-b border-gray-100 transition cursor-pointer ${
                isSelected 
                  ? 'bg-blue-600 text-white' 
                  : hasSelections
                    ? 'bg-green-100 text-green-800 ring-1 ring-green-400'
                    : 'bg-blue-50 text-blue-700 ring-1 ring-blue-200 hover:bg-blue-100'
              }"
            >${day}</button>
          `;
        } else {
          calendarHTML += `
            <div class="py-2 text-center text-sm border-b border-gray-100 ${
              isPast ? 'text-gray-300' : 'text-gray-400'
            }">${day}</div>
          `;
        }
      }
      
      calendarHTML += `
        </div>
        
        <!-- Legend -->
        <div class="mt-2 flex gap-4 text-xs text-gray-500">
          <div class="flex items-center gap-1">
            <div class="w-3 h-3 bg-blue-50 ring-1 ring-blue-200 rounded-sm"></div>
            <span>Available dates</span>
          </div>
          <div class="flex items-center gap-1">
            <div class="w-3 h-3 bg-blue-600 rounded-sm"></div>
            <span>Currently viewing</span>
          </div>
          <div class="flex items-center gap-1">
            <div class="w-3 h-3 bg-green-100 ring-1 ring-green-400 rounded-sm"></div>
            <span>Slots confirmed</span>
          </div>
        </div>
        
        <!-- Selected Slots Summary -->
        <div id="calendarSummary" class="mt-2 flex-1 overflow-y-auto"></div>
      `;
      
      return calendarHTML;
    }

    function updateCalendarSummary() {
      const summaryDiv = document.getElementById('calendarSummary');
      if (!summaryDiv) return;
      
      const totalSelected = Object.values(selectedTimeSlots).reduce((sum, slots) => sum + slots.length, 0);
      
      if (totalSelected === 0) {
        summaryDiv.innerHTML = '';
        return;
      }
      
      let html = `
        <div class="bg-green-50 border-2 border-green-500 rounded-lg p-2 mt-2">
          <div class="flex items-center gap-2 mb-2">
            <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h3 class="font-bold text-green-900 text-xs">Selected Slots</h3>
          </div>
          <div class="space-y-1.5 max-h-32 overflow-y-auto">
      `;
      
      Object.entries(selectedTimeSlots).forEach(([date, slots]) => {
        if (slots.length === 0) return;
        const dateObj = new Date(date + 'T00:00:00');
        const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        
        html += `
          <div class="bg-white rounded p-1.5 border border-green-200">
            <div class="font-semibold text-green-900 text-xs mb-1">${dateStr}</div>
            ${slots.map(s => `
              <div class="flex items-center justify-between text-xs text-green-700 py-0.5 hover:bg-green-50 rounded px-1">
                <div class="flex items-center gap-1">
                  <svg class="w-3 h-3 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                  </svg>
                  <span>${s.display}</span>
                </div>
                <button 
                  onclick="removeTimeSlot('${date}', '${s.start}')"
                  class="text-red-500 hover:text-red-700 hover:bg-red-50 rounded p-0.5"
                  title="Remove this slot"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>
            `).join('')}
          </div>
        `;
      });
      
      html += '</div></div>';
      summaryDiv.innerHTML = html;
    }

    function removeTimeSlot(date, start) {
      if (selectedTimeSlots[date]) {
        selectedTimeSlots[date] = selectedTimeSlots[date].filter(s => s.start !== start);
        if (selectedTimeSlots[date].length === 0) {
          delete selectedTimeSlots[date];
        }
      }
      renderMainPage();
    }

    function navigateMonth(direction) {
      const d = new Date(currentViewMonth);
      d.setMonth(d.getMonth() + direction);
      currentViewMonth = d;
      renderMainPage();
    }

    function renderMainPage() {
      const dateGroups = {};
      availabilityData.slots.forEach(slot => {
        if (!dateGroups[slot.date]) {
          dateGroups[slot.date] = {
            date: slot.date,
            startTime: slot.start,
            endTime: slot.end
          };
        }
      });

      const dates = Object.values(dateGroups).sort((a, b) => new Date(a.date) - new Date(b.date));

      // Compute available months
      availableMonths = [...new Set(dates.map(d => d.date.substring(0, 7)))]; // ["2026-05", "2026-06"]

      // Set initial view month if not set
      if (!currentViewMonth && dates.length > 0) {
        const first = new Date(dates[0].date + 'T00:00:00');
        currentViewMonth = new Date(first.getFullYear(), first.getMonth(), 1);
      }

      if (!selectedDate && dates.length > 0) {
        selectedDate = dates[0].date;
      }

      const totalSelected = Object.values(selectedTimeSlots).reduce((sum, slots) => sum + slots.length, 0);

      document.getElementById('app').innerHTML = `
        <div class="container mx-auto px-3 py-2 max-w-6xl" style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
          <!-- Header -->
          <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-lg p-3 mb-2 shadow-lg flex-shrink-0">
            <h1 class="text-lg font-bold">Confirm Your Interview Availability</h1>
            <p class="text-xs text-blue-100">Hi ${availabilityData.candidate_name}, please select when you're available for <strong>${availabilityData.job_title}</strong></p>
          </div>

          <!-- Instructions -->
          <div class="bg-blue-50 border-2 border-blue-300 rounded-lg p-3 mb-2 flex-shrink-0">
            <div class="flex items-center gap-2">
              <svg class="w-5 h-5 text-blue-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
              </svg>
              <p class="text-xs text-blue-900"><strong>How it works:</strong> Choose your preferred dates from the highlighted dates shared by the recruiter, select available time slots, then click confirm.</p>
            </div>
          </div>

          <!-- Available Months Summary -->
          ${availableMonths.length > 1 ? `
            <div class="flex items-center gap-2 mb-2 flex-shrink-0 flex-wrap">
              <span class="text-xs font-semibold text-gray-600">📅 Dates available in:</span>
              ${availableMonths.map(ym => {
                const [y, m] = ym.split('-');
                const monthObj = new Date(parseInt(y), parseInt(m) - 1, 1);
                const label = monthObj.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                const isViewing = currentViewMonth.getFullYear() === parseInt(y) && currentViewMonth.getMonth() === parseInt(m) - 1;
                const dateCount = dates.filter(d => d.date.startsWith(ym)).length;
                return `
                  <button 
                    onclick="currentViewMonth = new Date(${y}, ${parseInt(m) - 1}, 1); renderMainPage();"
                    class="px-2.5 py-1 rounded-full text-xs font-medium transition ${
                      isViewing 
                        ? 'bg-blue-600 text-white shadow-sm' 
                        : 'bg-gray-100 text-gray-700 hover:bg-blue-100 hover:text-blue-700'
                    }"
                  >
                    ${label} (${dateCount})
                  </button>
                `;
              }).join('')}
            </div>
          ` : ''}

          <!-- Main Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 flex-1 min-h-0 overflow-hidden">
            
            <!-- LEFT: Calendar + Selected Slots -->
            <div class="bg-white rounded-lg shadow-md p-3 flex flex-col overflow-hidden">
              ${renderCalendar(dates)}
            </div>

            <!-- RIGHT: Time Slots + Confirm -->
            <div class="bg-white rounded-lg shadow-md p-3 flex flex-col overflow-hidden">
              <div class="text-sm font-semibold text-gray-800 mb-1">
                ${selectedDate ? (() => {
                  const d = new Date(selectedDate + 'T00:00:00');
                  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                })() : 'Select a date'}
              </div>
              <p class="text-xs text-gray-500 mb-2">Click to select time slots</p>

              ${selectedDate ? renderTimeSlots() : `
                <div class="flex-1 flex items-center justify-center text-gray-400">
                  <div class="text-center">
                    <svg class="w-10 h-10 mx-auto mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <p class="text-xs">Select dates from calendar</p>
                  </div>
                </div>
              `}

              <!-- Confirm Button -->
              <button 
                onclick="confirmAvailability()" 
                ${totalSelected === 0 ? 'disabled' : ''}
                class="w-full py-2.5 rounded-lg text-center font-bold text-sm flex items-center justify-center gap-2 transition-all mt-auto flex-shrink-0 ${
                  totalSelected > 0 
                    ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-md' 
                    : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                }"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Confirm My Availability
              </button>
            </div>
          </div>
        </div>
      `;
      
      // Update calendar summary after rendering
      updateCalendarSummary();
    }

    function renderTimeSlots() {
      const slot = availabilityData.slots.find(s => s.date === selectedDate);
      if (!slot) return '<p class="text-sm text-gray-500">No time slots available</p>';

      const hourlySlots = generateHourlySlots(slot.start, slot.end);
      const selected = selectedTimeSlots[selectedDate] || [];

      const dateObj = new Date(selectedDate + 'T00:00:00');
      const dateString = dateObj.toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'long', 
        day: 'numeric' 
      });

      return `
        <div class="flex flex-col flex-1 min-h-0">
          <div class="grid grid-cols-2 gap-1.5 overflow-y-auto flex-1 pr-1">
            ${hourlySlots.map(timeSlot => {
              const isSelected = selected.some(s => s.start === timeSlot.start);
              return `
                <button 
                  onclick="toggleTimeSlot('${selectedDate}', '${timeSlot.start}', '${timeSlot.end}', '${timeSlot.display}')"
                  class="time-slot px-2 py-1.5 rounded border text-center text-xs font-medium transition ${
                    isSelected 
                      ? 'bg-blue-600 border-blue-600 text-white' 
                      : 'bg-white border-gray-200 text-gray-700 hover:border-blue-300 hover:bg-blue-50'
                  }"
                >
                  ${timeSlot.display} ${isSelected ? '✓' : ''}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function selectDate(date) {
      selectedDate = date;
      renderMainPage();
    }

    function toggleTimeSlot(date, start, end, display) {
      if (!selectedTimeSlots[date]) {
        selectedTimeSlots[date] = [];
      }
      
      const index = selectedTimeSlots[date].findIndex(s => s.start === start);
      
      if (index >= 0) {
        selectedTimeSlots[date].splice(index, 1);
      } else {
        selectedTimeSlots[date].push({ date, start, end, display });
      }
      
      renderMainPage();
    }

    async function confirmAvailability() {
      const allSlots = [];
      Object.values(selectedTimeSlots).forEach(slots => {
        allSlots.push(...slots);
      });
      
      if (allSlots.length === 0) {
        alert('Please select at least one time slot');
        return;
      }
      
      const btn = event.target;
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin w-6 h-6" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Confirming...
      `;

      try {
        await supabaseUpdate(
          'availability_requests',
          {
            selected_slot: allSlots,
            status: 'confirmed',
            confirmed_at: new Date().toISOString()
          },
          `token=eq.${token}`
        );

        showSuccess();
      } catch (err) {
        console.error('Error:', err);
        alert('Failed to confirm. Please try again.');
        btn.disabled = false;
        btn.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Confirm My Availability
        `;
      }
    }

    function showSuccess() {
      document.getElementById('app').innerHTML = `
        <div class="flex items-center justify-center min-h-screen px-4">
          <div class="bg-white rounded-xl shadow-xl p-10 text-center max-w-lg w-full">
            <div class="w-20 h-20 bg-gradient-to-br from-green-400 to-emerald-500 rounded-full flex items-center justify-center mx-auto mb-5 animate-bounce">
              <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-3">Thank You!</h2>
            <p class="text-base text-gray-600 mb-2">Your availability has been confirmed successfully.</p>
            <p class="text-sm text-gray-500">The recruiter will contact you shortly to schedule your interview.</p>
            <div class="mt-6 pt-6 border-t border-gray-200">
              <p class="text-xs text-gray-400">You can now close this page.</p>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
